# Shared workflow: mindlogic-ai/claude-code (.github/workflows/claude.yml). Edit behaviour there, not here.
name: Claude

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: mindlogic-ai/claude-code/.github/workflows/claude.yml@main
    secrets: inherit
