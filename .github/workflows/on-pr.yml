name: PR Checks

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linting
        run: yarn lint

      - name: Run type checking
        run: yarn type-check

      # The suite was never run here. `package.json` has had `"test": "vitest
      # run"` the whole time and no workflow called it, so every test in this
      # repo was decorative — including `src/components/a11y.kwcag.test.tsx`,
      # which holds nine accessibility defects that already shipped once and
      # that FactChat's KWCAG 2.1 certification depends on staying fixed.
      # Putting `Subtitle` back to `as="h6"` passed every check before this
      # line existed. It takes ~13s.
      - name: Run tests
        run: yarn test

      - name: Build package
        run: yarn build
        env:
          NODE_ENV: production
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Build Storybook
        run: yarn build-storybook
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
